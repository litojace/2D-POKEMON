<!--
  Alternate app icon "Pyranda": Pyranda's face, close up, in a fire glow on a
  cool blue background. scripts/generate-icons.mjs renders it (default, dark
  and tinted) to the AppIcon-Pyranda set; players pick it in Settings.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="78%">
      <stop offset="0" stop-color="#2bb3d9"/>
      <stop offset=".55" stop-color="#1b4fa8"/>
      <stop offset="1" stop-color="#0e1a4f"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#ffe17b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffe17b" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0a0630" flood-opacity=".5"/>
    </filter>
  </defs>

  <g id="backdrop">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <!-- Twelve soft rays from behind the head. -->
    <g fill="#fff" opacity=".07">
      <polygon points="512,470 1408,389 1408,551"/>
      <polygon points="512,470 1329,848 1248,988"/>
      <polygon points="512,470 1030,1206 890,1287"/>
      <polygon points="512,470 593,1366 431,1366"/>
      <polygon points="512,470 134,1287 -6,1206"/>
      <polygon points="512,470 -224,988 -305,848"/>
      <polygon points="512,470 -384,551 -384,389"/>
      <polygon points="512,470 -305,92 -224,-48"/>
      <polygon points="512,470 -6,-266 134,-347"/>
      <polygon points="512,470 431,-426 593,-426"/>
      <polygon points="512,470 890,-347 1030,-266"/>
      <polygon points="512,470 1248,-48 1329,92"/>
    </g>
  </g>
  <circle cx="512" cy="470" r="400" fill="url(#glow)" opacity=".85"/>
  <g filter="url(#lift)">
    <svg data-fighter="pyranda" x="-30" y="40" width="1084" height="1084" viewBox="12 -16 176 176" overflow="visible"></svg>
  </g>
</svg>
