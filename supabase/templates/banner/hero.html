<html><head><style>
body{margin:0}
.b{position:relative;width:600px;height:240px;overflow:hidden;background:#0b1020}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;filter:brightness(.5) saturate(1.1)}
.c{position:absolute;filter:drop-shadow(0 5px 8px rgba(0,0,0,.55))}
.sh{position:absolute;height:10px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(3px)}
.g{position:absolute;border-radius:50%;filter:blur(22px)}
.fx{position:absolute;overflow:visible}
</style></head><body><div class="b">
<img class="bg" src="../../../apps/client/public/assets/backgrounds/plaza-night-voltkit.webp">
<!-- glows -->
<div class="g" style="left:70px;top:150px;width:110px;height:70px;background:#3d8bff;opacity:.6"></div>
<div class="g" style="left:245px;top:110px;width:120px;height:90px;background:#ffd65b;opacity:.55"></div>
<div class="g" style="left:40px;top:20px;width:90px;height:70px;background:#a45bff;opacity:.5"></div>
<div class="g" style="left:470px;top:20px;width:100px;height:70px;background:#ff9a3d;opacity:.5"></div>
<!-- ground shadows -->
<div class="sh" style="left:18px;top:226px;width:70px"></div>
<div class="sh" style="left:95px;top:228px;width:80px"></div>
<div class="sh" style="left:262px;top:224px;width:76px;opacity:.35"></div>
<div class="sh" style="left:378px;top:228px;width:72px"></div>
<div class="sh" style="left:490px;top:228px;width:80px"></div>

<!-- Mystowl: floating, casting (focus), upper left -->
<img class="c" src="mystowl.svg" style="left:44px;top:8px;width:84px;transform:rotate(-6deg) scaleX(-1)">
<!-- Terradon: dizzy, knocked over a bit -->
<img class="c" src="terradon.svg" style="left:6px;top:138px;width:92px;transform:rotate(-14deg)">
<!-- Cindrake: charging, leaning in -->
<img class="c" src="cindrake.svg" style="left:92px;top:118px;width:112px;transform:rotate(8deg)">
<!-- Voltkit: jumping for joy -->
<img class="c" src="voltkit.svg" style="left:226px;top:26px;width:150px;transform:rotate(-4deg)">
<!-- Coilemur: hit, recoiling -->
<img class="c" src="coilemur.svg" style="left:370px;top:124px;width:96px;transform:rotate(12deg)">
<!-- Tidefin: bouncing happily -->
<img class="c" src="tidefin.svg" style="left:478px;top:112px;width:108px;transform:rotate(-5deg)">
<!-- Lumoth: floating, upper right -->
<img class="c" src="lumoth.svg" style="left:478px;top:2px;width:86px;transform:rotate(6deg)">

<svg class="fx" width="600" height="240" style="left:0;top:0">
  <!-- dizzy stars over Terradon -->
  <g fill="#ffe27a" stroke="#b8861f" stroke-width="1">
    <path d="M30 150 l3 6 6 1 -5 4 1 6 -5 -3 -5 3 1 -6 -5 -4 6 -1z"/>
    <path d="M62 140 l2.4 4.8 4.8 .8 -4 3.2 .8 4.8 -4 -2.4 -4 2.4 .8 -4.8 -4 -3.2 4.8 -.8z"/>
    <path d="M86 156 l2 4 4 .6 -3 2.6 .6 4 -3.6 -2 -3.6 2 .6 -4 -3 -2.6 4 -.6z"/>
  </g>
  <ellipse cx="58" cy="158" rx="34" ry="8" fill="none" stroke="#ffe27a" stroke-width="1.5" stroke-dasharray="4 5" opacity=".8" transform="rotate(-14 58 158)"/>
  <!-- Cindrake blue flame charge lines -->
  <g stroke="#8fd0ff" stroke-width="2.5" stroke-linecap="round" opacity=".85">
    <line x1="86" y1="150" x2="100" y2="150"/><line x1="80" y1="170" x2="98" y2="172"/><line x1="88" y1="190" x2="100" y2="192"/>
  </g>
  <!-- Voltkit sparkles and sparks -->
  <g fill="#fff6c2">
    <path d="M232 40 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path d="M378 52 l2.2 6.6 6.6 2.2 -6.6 2.2 -2.2 6.6 -2.2 -6.6 -6.6 -2.2 6.6 -2.2z"/>
    <path d="M358 18 l1.6 4.8 4.8 1.6 -4.8 1.6 -1.6 4.8 -1.6 -4.8 -4.8 -1.6 4.8 -1.6z"/>
  </g>
  <polyline points="372,118 384,128 378,132 392,146" fill="none" stroke="#ffe066" stroke-width="3" stroke-linejoin="round"/>
  <!-- impact burst + sweat on Coilemur -->
  <g transform="translate(392 146)"><path d="M0 -14 L4 -4 14 -6 6 2 12 12 0 6 -10 12 -6 2 -14 -4 -4 -4z" fill="#fff3a0" stroke="#ff9d2e" stroke-width="1.5" opacity=".95"/></g>
  <path d="M452 132 q6 8 0 12 q-6 -4 0 -12z" fill="#9fdcff" stroke="#3a8fd0" stroke-width="1"/>
  <!-- Tidefin hearts and bubbles -->
  <g fill="#ff7aa8"><path d="M574 116 c-3 -5 -10 -2 -7 3 l7 7 7 -7 c3 -5 -4 -8 -7 -3z"/><path d="M482 108 c-2 -3.5 -7 -1.5 -5 2 l5 5 5 -5 c2 -3.5 -3 -5.5 -5 -2z"/></g>
  <g fill="none" stroke="#bfe9ff" stroke-width="1.5" opacity=".8"><circle cx="590" cy="150" r="4"/><circle cx="584" cy="136" r="2.5"/></g>
  <!-- Mystowl magic sparkles -->
  <g fill="#d6b3ff"><path d="M132 30 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/><path d="M118 70 l1.4 4.2 4.2 1.4 -4.2 1.4 -1.4 4.2 -1.4 -4.2 -4.2 -1.4 4.2 -1.4z"/></g>
</svg>
<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,16,32,0) 70%,rgba(18,26,49,.55) 100%)"></div>
</div></body></html>
