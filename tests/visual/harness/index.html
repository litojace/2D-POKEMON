<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Element Arena" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/arena-192.png" />
    <title>Element Arena · visual harness</title>
    <!-- Keep a usable loading/retry screen even when a release's JS or CSS
         cannot load. This small shell needs no other file (its two fonts are
         optional). -->
    <!-- The boot screen's title and line (optional: system fonts if not). -->
    <link
      rel="preload"
      href="/assets/fonts/barlow-condensed-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/dm-sans-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style id="arena-boot-style">
      html {
        background: #0b1020;
        color: #edf3ff;
      }
      body {
        margin: 0;
      }
      #rotate-gate {
        display: none;
      }
      /* While the game's code downloads, this shell is laid out exactly as
         the startup curtain that follows it (server-connection.css: the same
         padding, card, title, divider and line), so the title doesn't move
         when the curtain takes over. Its fonts are optional: if they can't
         load, system fonts show and the retry page still works. */
      @font-face {
        font-family: "Barlow Condensed";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("/assets/fonts/barlow-condensed-latin-600-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("/assets/fonts/dm-sans-latin-500-normal.woff2") format("woff2");
      }
      #app-boot,
      #app-boot * {
        box-sizing: border-box;
      }
      #app-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483001;
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        overflow: auto;
        background: #040d1e;
        color: #f2f5ff;
        text-align: center;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      #app-boot .boot-card {
        width: min(1080px, 100%);
        height: 100%;
        max-height: 900px;
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        justify-items: center;
        gap: clamp(8px, 2vh, 18px);
      }
      #app-boot .boot-brand {
        display: grid;
        justify-items: center;
        gap: clamp(7px, 1.2vh, 12px);
      }
      #app-boot h1 {
        margin: 0;
        color: #f2f5ff;
        font:
          600 clamp(27px, 7.2vh, 60px) / 0.96 "Barlow Condensed",
          Impact,
          sans-serif;
        text-transform: uppercase;
        text-shadow:
          0 2px 14px #020714,
          0 0 25px #9dcfff22;
      }
      #app-boot h1 span {
        display: block;
        letter-spacing: 0.17em;
        padding-left: 0.17em;
      }
      #app-boot .boot-divider {
        position: relative;
        display: block;
        width: clamp(94px, 17vh, 150px);
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          #dfbd6b 35%,
          #dfbd6b 65%,
          transparent
        );
      }
      #app-boot .boot-divider::after {
        content: "";
        position: absolute;
        width: 6px;
        height: 6px;
        top: -3px;
        left: calc(50% - 3px);
        transform: rotate(45deg);
        background: #f3d58c;
      }
      #app-boot .boot-loading {
        grid-row: 3;
        width: min(520px, 100%);
        display: grid;
        justify-items: center;
        gap: 10px;
      }
      #app-boot p {
        margin: 0;
        color: #f1f4fc;
        font:
          500 clamp(14px, 2.1vh, 18px) / 1.3 "DM Sans",
          sans-serif;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 10px #020714;
      }
      #app-boot .boot-progress {
        display: block;
        width: 100%;
        height: 12px;
        border: 1px solid #d7b56ddd;
        border-radius: 999px;
        background: #050e20e6;
      }
      /* The space the curtain's status line and tip take (empty here), so
         "Opening the arena…" doesn't move either. */
      #app-boot .boot-status {
        display: block;
        min-height: 2.8em;
        font: 400 clamp(11px, 1.6vh, 13px) / 1.4 sans-serif;
      }
      #app-boot .boot-tip {
        display: block;
        visibility: hidden;
        width: min(560px, 100%);
        font: 400 clamp(12px, 1.9vh, 15px) / 1.4 sans-serif;
        min-height: calc(2.8em + 18px);
        margin-top: 2px;
      }
      .boot-no-tips #app-boot .boot-tip {
        display: none;
      }
      /* The painting layout, style K (server-connection.css .has-art): the
         gold star and title top right, one status line over a bar across
         the whole width at the bottom, placed from the screen's edges
         exactly as the curtain places them. */
      #app-boot .boot-crest {
        display: none;
      }
      .boot-art #app-boot {
        --art-top: max(14px, env(safe-area-inset-top));
        --art-bottom: max(14px, env(safe-area-inset-bottom));
        --art-left: max(28px, env(safe-area-inset-left));
        --art-right: max(28px, env(safe-area-inset-right));
      }
      .boot-art #app-boot .boot-card {
        display: contents;
      }
      .boot-art #app-boot .boot-brand {
        position: absolute;
        top: var(--art-top);
        right: var(--art-right);
        display: flex;
        align-items: center;
        gap: clamp(8px, 1.6vh, 14px);
      }
      .boot-art #app-boot .boot-crest {
        display: block;
        flex: none;
        width: clamp(40px, 11.5vh, 88px);
        height: clamp(40px, 11.5vh, 88px);
        filter: drop-shadow(0 0 10px #ffd76a88);
      }
      .boot-art #app-boot h1 {
        font-size: clamp(24px, 7vh, 54px);
        text-align: left;
      }
      .boot-art #app-boot :is(.boot-divider, .boot-status, .boot-tip) {
        display: none;
      }
      .boot-art #app-boot .boot-loading {
        position: absolute;
        left: calc(var(--art-left) + 13px);
        right: calc(var(--art-right) + 13px);
        bottom: var(--art-bottom);
        width: auto;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      .boot-art #app-boot p {
        order: -1;
        height: 1.4em;
        color: #f2f5ff;
        font:
          500 clamp(13px, 3.4vh, 17px) / 1.4 "DM Sans",
          sans-serif;
        letter-spacing: normal;
        text-align: left;
        white-space: nowrap;
      }
      @media (max-height: 320px) {
        .boot-art #app-boot {
          --art-top: max(10px, env(safe-area-inset-top));
          --art-bottom: max(10px, env(safe-area-inset-bottom));
        }
      }
      .boot-art #app-boot.is-failed .boot-card {
        display: grid;
        width: min(1080px, 100%);
        height: auto;
      }
      .boot-art #app-boot.is-failed :is(.boot-brand, .boot-loading) {
        position: static;
        display: grid;
      }
      .boot-art #app-boot.is-failed .boot-crest {
        display: none;
      }
      .boot-art #app-boot.is-failed p {
        height: auto;
        white-space: normal;
        text-align: center;
      }
      @media (max-height: 500px) {
        #app-boot {
          padding: max(14px, env(safe-area-inset-top))
            max(28px, env(safe-area-inset-right))
            max(14px, env(safe-area-inset-bottom))
            max(28px, env(safe-area-inset-left));
        }
        #app-boot .boot-card {
          gap: 8px;
        }
        #app-boot .boot-loading {
          width: min(430px, 100%);
          gap: 7px;
        }
      }
      @media (max-height: 320px) {
        #app-boot {
          padding-top: max(10px, env(safe-area-inset-top));
          padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        #app-boot .boot-brand {
          gap: 7px;
        }
        #app-boot h1 {
          font-size: 23px;
        }
        #app-boot .boot-loading {
          gap: 6px;
        }
        #app-boot p {
          font-size: 13px;
        }
        #app-boot .boot-status {
          font-size: 11px;
        }
        #app-boot .boot-tip {
          font-size: 11px;
          min-height: calc(2.8em + 12px);
        }
      }
      /* A failed load: a centred message and a reload button. */
      #app-boot.is-failed {
        background: #0b1020;
      }
      #app-boot.is-failed .boot-card {
        height: auto;
        grid-template-rows: none;
        gap: 14px;
      }
      #app-boot.is-failed .boot-loading {
        grid-row: auto;
        gap: 14px;
      }
      #app-boot.is-failed
        :is(.boot-divider, .boot-progress, .boot-status, .boot-tip) {
        display: none;
      }
      #app-boot.is-failed h1 {
        color: #ffe08a;
        font:
          700 28px/1.2 system-ui,
          sans-serif;
        text-transform: none;
      }
      #app-boot.is-failed p {
        color: #b0c2dd;
        font:
          16px/1.5 system-ui,
          sans-serif;
        letter-spacing: 0;
      }
      #app-boot button {
        justify-self: center;
        min-height: 44px;
        margin: 4px 0 0;
        padding: 10px 24px;
        border: 0;
        border-radius: 12px;
        background: #ffdc76;
        color: #211b0e;
        font:
          700 16px system-ui,
          sans-serif;
      }
      #app-boot [hidden] {
        display: none;
      }
    </style>
    <script>
      // The startup curtain's tips hold it until read (loading-tips.ts):
      // off here unless a test turns them on, so each start isn't seconds
      // slower.
      try {
        if (localStorage.getItem("ea-loading-tips") === null)
          localStorage.setItem("ea-loading-tips", "off");
      } catch {
        /* No storage: tips show. */
      }
    </script>
    <script>
      // No tip will show (loading-tips.ts): the boot screen keeps no space
      // for one.
      try {
        if (localStorage.getItem("ea-loading-tips") === "off")
          document.documentElement.classList.add("boot-no-tips");
        // A painting was chosen for this start (loading-art.ts): the
        // curtain takes its painting layout, and so does this screen.
        if (localStorage.getItem("ea-next-art"))
          document.documentElement.classList.add("boot-art");
      } catch {
        /* No storage: tips show. */
      }
    </script>
    <script>
      // iPadOS calls itself a Mac with a touch screen. Mark iPads so the
      // landscape cover shows when one is held upright, even with a Magic
      // Keyboard or trackpad attached (style.css, #rotate-gate).
      if (
        /iPad/.test(navigator.userAgent) ||
        (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
      )
        document.documentElement.classList.add("ipad-gate");
    </script>
    <script>
      (() => {
        let ready = false,
          assetFailed = false,
          reloading = false,
          timer;
        const failed = () => {
          if (ready) return;
          const shell = document.getElementById("app-boot");
          if (!shell) return;
          const title = shell.querySelector("h1");
          title.removeAttribute("aria-label");
          title.textContent = "The arena couldn't load";
          shell.classList.add("is-failed");
          shell.querySelector("p").textContent =
            "Reload to reconnect. Your account and progress are kept.";
          shell.querySelector("button").hidden = false;
          // A stale release URL or interrupted fetch can recover from fresh
          // entry HTML. Retry once before startup, never during a running game.
          if (assetFailed && !reloading && navigator.onLine) {
            try {
              const previous = Number(
                sessionStorage.getItem("arena-boot-retry") || 0,
              );
              if (Date.now() - previous > 60000) {
                reloading = true;
                sessionStorage.setItem("arena-boot-retry", String(Date.now()));
                setTimeout(() => {
                  if (!ready) location.reload();
                }, 400);
              }
            } catch {
              /* Private/storage-restricted browsing keeps manual retry. */
            }
          }
        };
        window.addEventListener(
          "error",
          (event) => {
            if (ready) return;
            const target = event.target;
            if (
              event.error ||
              (target instanceof HTMLScriptElement &&
                target.type === "module") ||
              (target instanceof HTMLLinkElement && target.rel === "stylesheet")
            ) {
              assetFailed = true;
              failed();
            }
          },
          true,
        );
        window.addEventListener("arena:ready", () => {
          if (assetFailed) return;
          ready = true;
          clearTimeout(timer);
          try {
            sessionStorage.removeItem("arena-boot-retry");
          } catch {
            /* optional */
          }
          document.getElementById("app-boot")?.remove();
        });
        window.addEventListener("DOMContentLoaded", () => {
          const shell = document.getElementById("app-boot");
          if (!shell) return;
          shell.querySelector("button").onclick = () => location.reload();
          if (assetFailed) failed();
          timer = setTimeout(failed, 15000);
        });
      })();
    </script>
  </head>
  <body>
    <section id="app-boot" role="status" aria-live="polite">
      <div class="boot-card">
        <header class="boot-brand">
          <svg class="boot-crest" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="boot-crest-gold" x2="0" y2="1">
                <stop stop-color="#fff1a3" />
                <stop offset="1" stop-color="#d9a340" />
              </linearGradient>
            </defs>
            <path
              fill="url(#boot-crest-gold)"
              fill-rule="evenodd"
              d="M32 2 42 21 62 32 43 43 32 62 21 43 2 32 21 21Zm0 14L16 32l16 16 16-16Z"
            />
          </svg>
          <h1 aria-label="Element Arena">
            <span>Element</span><span>Arena</span>
          </h1>
          <span class="boot-divider" aria-hidden="true"></span>
        </header>
        <div class="boot-loading">
          <p>Opening the arena…</p>
          <span class="boot-progress" aria-hidden="true"></span>
          <span class="boot-status" aria-hidden="true"></span>
          <span class="boot-tip" aria-hidden="true"></span>
          <button type="button" hidden>Reload game</button>
        </div>
      </div>
    </section>
    <div id="app"></div>
    <!-- Element Arena plays in landscape only. On touch devices held upright
         this covers everything (see rotate-gate.ts and style.css). -->
    <div id="rotate-gate" role="status" aria-live="polite">
      <div class="rotate-gate-card">
        <span class="rotate-gate-phone" aria-hidden="true"></span>
        <h2>Turn your device sideways</h2>
        <p>Element Arena plays in landscape.</p>
        <button type="button" class="primary" id="rotate-gate-lock" hidden>
          Rotate for me
        </button>
      </div>
    </div>
    <script type="module" src="./entry.ts"></script>
  </body>
</html>
