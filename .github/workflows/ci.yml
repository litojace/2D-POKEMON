name: Arena checks
on:
  # A change to docs or Markdown alone runs nothing: no check reads them.
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node scripts/verify-pwa.mjs
  visual:
    # The real client in Chromium with no server: one fighter on the select
    # screen, arenas filling their frames, dialogs fitting a phone.
    # Nine shards of about equal running time (scripts/visual-shards.mjs, from
    # the durations in tests/visual/durations.json), one worker each, so
    # timing checks keep a machine to themselves. Playwright's own --shard
    # splits by test count, and with tests of 3 s to 7 min that made shards of
    # 5 to 30 minutes. GitHub runs only about ten of this repository's jobs at
    # once, so nine shards plus verify fit (verify also runs for the push, a
    # few minutes). Two workers per runner were tried and made CI slower and
    # time tests out: one Chromium rendering in software already keeps a
    # runner busy. It runs for main (what Render deploys), pull requests and
    # manual runs, not again for the same commit on work.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: visual (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "1 of 9", shard: "1 9" }
          - { part: "2 of 9", shard: "2 9" }
          - { part: "3 of 9", shard: "3 9" }
          - { part: "4 of 9", shard: "4 9" }
          - { part: "5 of 9", shard: "5 9" }
          - { part: "6 of 9", shard: "6 9" }
          - { part: "7 of 9", shard: "7 9" }
          - { part: "8 of 9", shard: "8 9" }
          - { part: "9 of 9", shard: "9 9" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The pattern goes straight to Playwright: npm would re-quote it.
      - run: npx playwright test --config tests/visual/playwright.config.ts --grep "$(node scripts/visual-shards.mjs ${{ matrix.shard }})"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 1
  visual-report:
    # One HTML report from every shard (screenshots for a person to look over).
    needs: visual
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
      # Fresh durations for scripts/visual-shards.mjs: download the
      # visual-durations artifact and commit it as tests/visual/durations.json
      # when shards drift apart.
      - run: |
          npx playwright merge-reports --reporter json ./all-blob-reports > visual-results.json
          node scripts/visual-shards.mjs --update visual-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: visual-durations
          path: tests/visual/durations.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: playwright-report/
          retention-days: 14
