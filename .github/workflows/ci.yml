name: Arena checks
on:
  # A change to docs or Markdown alone runs nothing: no check reads them.
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node scripts/verify-pwa.mjs
  visual:
    # The real client in Chromium with no server: one fighter on the select
    # screen, arenas filling their frames, dialogs fitting a phone.
    # Shards of about equal running time (scripts/visual-shards.mjs, from the
    # durations in tests/visual/durations.json): the timing and frame-rate
    # specs alone on one worker, every other test spread over seven shards
    # of two workers each (4-CPU runners). Playwright's own --shard splits by
    # test count, and with tests of 3 s to 7 min that made shards of 5 to 17
    # minutes; GitHub also runs only about ten of this repository's jobs at
    # once, so eight shards plus verify (twice: push and pull request) fit
    # without waiting. It runs for main (what Render deploys), pull requests
    # and manual runs, not again for the same commit on work.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    name: visual (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "timing", shard: "timing", workers: 1 }
          - { part: "1 of 7", shard: "1 7", workers: 2 }
          - { part: "2 of 7", shard: "2 7", workers: 2 }
          - { part: "3 of 7", shard: "3 7", workers: 2 }
          - { part: "4 of 7", shard: "4 7", workers: 2 }
          - { part: "5 of 7", shard: "5 7", workers: 2 }
          - { part: "6 of 7", shard: "6 7", workers: 2 }
          - { part: "7 of 7", shard: "7 7", workers: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The pattern goes straight to Playwright: npm would re-quote it.
      - run: npx playwright test --config tests/visual/playwright.config.ts --workers=${{ matrix.workers }} --grep "$(node scripts/visual-shards.mjs ${{ matrix.shard }})"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 1
  visual-report:
    # One HTML report from every shard (screenshots for a person to look over).
    needs: visual
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
      # Fresh durations for scripts/visual-shards.mjs: download the
      # visual-durations artifact and commit it as tests/visual/durations.json
      # when shards drift apart.
      - run: |
          npx playwright merge-reports --reporter json ./all-blob-reports > visual-results.json
          node scripts/visual-shards.mjs --update visual-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: visual-durations
          path: tests/visual/durations.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: playwright-report/
          retention-days: 14
