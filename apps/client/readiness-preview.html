<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Readiness click regression demo</title>
  </head>
  <body>
    <div class="arena-frame" style="height: 100dvh">
      <div id="arena-overlay"></div>
    </div>
    <script type="module">
      import "./src/style.css";
      import { setOverlayMarkup } from "./src/overlay";
      const overlay = document.querySelector("#arena-overlay");
      let clicked = false;
      const ready =
        '<div class="overlay-card"><span class="eyebrow">ELEMENT ARENA · CONTROL DEMO</span><h2>How to play</h2><div class="controls-list"><span><kbd>W A S D</kbd>Move · mouse to aim</span><span><kbd>LMB</kbd>Basic attack</span><span><kbd>1 2 3</kbd>Character skills</span><span><kbd>R</kbd>Ultimate skill</span><span><kbd>RMB</kbd>Dash</span><span><kbd>SPACE</kbd>Jump over ground attacks</span></div><p>15 popup updates per second · hold then release the button to test.</p><button class="primary" id="instructions-ready">I’m ready →</button></div>';
      function tick() {
        setOverlayMarkup(
          overlay,
          clicked
            ? '<div class="overlay-card"><h2>Ready confirmed</h2><p>The button click survived the repeated updates.</p></div>'
            : ready,
        );
        const button = document.querySelector("#instructions-ready");
        if (button)
          button.onclick = () => {
            clicked = true;
            tick();
          };
      }
      tick();
      setInterval(tick, 1000 / 15);
    </script>
  </body>
</html>
