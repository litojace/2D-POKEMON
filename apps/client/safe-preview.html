<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101c35" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Pokémon Arena" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/arena-192.png" />
    <title>Pokémon Arena · Online duels</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      for (const side of ["top", "right", "bottom", "left"]) {
        const inset = Number(params.get("safe-" + side));
        if (inset > 0)
          document.documentElement.style.setProperty(
            "--safe-" + side,
            Math.min(100, inset) + "px",
          );
      }
      await import("./src/main.ts");
    </script>
  </body>
</html>
