<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Touch controls preview</title>
  </head>
  <body>
    <main id="battle">
      <h2 hidden>Mobile controls preview</h2>

      <div
        id="preview"
        class="arena-frame"
        style="background: radial-gradient(circle at center, #397451, #214736)"
      >
        <span
          id="marker"
          style="position: absolute; left: 50%; top: 50%; font-size: 30px"
          >⚡</span
        >
      </div>
      <p id="action" class="hud" role="status">
        CONTROL DEMO · Move and attack together · no live match
      </p>
      <div id="controls"></div>
    </main>
    <script type="module">
      import "./src/style.css";
      import { TouchControls } from "./src/touch-controls";
      const action = document.querySelector("#action");
      const controls = new TouchControls(
        document.querySelector("#controls"),
        () => true,
        (a) => (action.textContent = "Action: " + JSON.stringify(a)),
        (text) => (action.textContent = text),
      );
      if (!controls.enabled) document.querySelector("#touch-toggle").click();
      document.body.classList.add("battle-active");
      controls.resize();
      controls.update(
        true,
        ["Thunderbolt", "Electro Orb", "Static Field", "Thunderstorm"],
        [0, 0, 0, 0],
        0,
        0,
      );
      document.querySelector("#mobile-settings").onclick = () => {
        const panel = document.createElement("dialog");
        panel.innerHTML =
          controls.settingsHTML() + '<button id="preview-close">Done</button>';
        document.body.append(panel);
        panel.showModal();
        controls.bindSettings();
        panel.querySelector("#preview-close").onclick = () => {
          panel.close();
          panel.remove();
        };
      };
      let x = 50,
        y = 50;
      function frame() {
        x = Math.max(5, Math.min(95, x + controls.dx * 0.5));
        y = Math.max(10, Math.min(90, y + controls.dy * 0.5));
        const marker = document.querySelector("#marker");
        marker.style.left = x + "%";
        marker.style.top = y + "%";
        if (controls.basic) action.textContent = "Attack held";
        requestAnimationFrame(frame);
      }
      frame();
    </script>
  </body>
</html>
