<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Touch controls preview</title>
  </head>
  <body>
    <main id="battle">
      <h2 hidden>Mobile controls preview</h2>

      <div
        id="preview"
        class="arena-frame"
        style="background: radial-gradient(circle at center, #365783, #1e3557)"
      >
        <span
          id="marker"
          style="position: absolute; left: 50%; top: 50%; font-size: 30px"
          >⚡</span
        >
      </div>
      <p id="action" class="hud" role="status">
        CONTROL DEMO · Move and attack together · no live match
      </p>
      <div id="controls"></div>
    </main>
    <script type="module">
      import "./src/style.css";
      import { stadiumCrowd } from "./src/stadium";
      document
        .querySelector("#battle")
        .insertAdjacentHTML("afterbegin", stadiumCrowd());
      import { TouchControls } from "./src/touch-controls";
      const action = document.querySelector("#action");
      // Development-only cutout simulation for responsive HUD verification.
      const insetParams = new URLSearchParams(location.search);
      for (const side of ["top", "right", "bottom", "left"]) {
        const inset = Number(insetParams.get("safe-" + side));
        if (inset > 0)
          document.documentElement.style.setProperty(
            "--safe-" + side,
            Math.min(100, inset) + "px",
          );
      }
      import { setupBattleDock } from "./src/battle-dock";
      const overlay = document.createElement("div");
      overlay.id = "arena-overlay";
      document.querySelector("#preview").append(overlay);
      const footer = document.createElement("div");
      footer.className = "battle-footer";
      footer.innerHTML = '<button id="battle-menu" class="quiet">Menu</button>';
      const practice = document.createElement("div");
      practice.id = "practice-controls";
      practice.innerHTML =
        '<details class="practice-settings"><summary>Practice</summary><div class="practice-panel">Training options preview<button id="preview-popup">Show popup</button></div></details>';
      const controls = new TouchControls(
        document.querySelector("#controls"),
        () => true,
        (a) => (action.textContent = "Action: " + JSON.stringify(a)),
        (text) => (action.textContent = text),
        undefined,
        true,
      );
      if (!controls.enabled) document.querySelector("#touch-toggle").click();
      setupBattleDock(
        document.querySelector("#battle"),
        document.querySelector("#controls"),
        footer,
        practice,
      );
      document.querySelector("#battle-menu").onclick = () =>
        document.querySelector("#mobile-settings").click();
      document.querySelector("#preview-popup").onclick = () => {
        overlay.innerHTML =
          '<div class="overlay-card"><h2>How to play</h2><button id="preview-ready">I am ready</button></div>';
        document.querySelector("#preview-ready").onclick = () =>
          (overlay.innerHTML = "");
      };
      document.body.classList.add("battle-active");
      controls.resize();
      controls.update(
        true,
        ["Arc Pulse", "Charge Orb", "Livewire Field", "Overcharge"],
        [0, 0, 0, 0],
        0,
        0,
      );
      document.querySelector("#mobile-settings").onclick = () => {
        const panel = document.createElement("dialog");
        panel.innerHTML =
          controls.settingsHTML() + '<button id="preview-close">Done</button>';
        document.body.append(panel);
        panel.showModal();
        controls.bindSettings();
        panel.querySelector("#preview-close").onclick = () => {
          panel.close();
          panel.remove();
        };
      };
      let x = 50,
        y = 50;
      function frame() {
        x = Math.max(5, Math.min(95, x + controls.dx * 0.5));
        y = Math.max(10, Math.min(90, y + controls.dy * 0.5));
        const marker = document.querySelector("#marker");
        marker.style.left = x + "%";
        marker.style.top = y + "%";
        if (controls.basic) action.textContent = "Attack held";
        requestAnimationFrame(frame);
      }
      frame();
    </script>
  </body>
</html>
