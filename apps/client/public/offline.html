<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101c35" />
    <title>Pokémon Arena · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #101c35;
        color: #eff4e5;
        font-family: system-ui;
        padding: calc(env(safe-area-inset-top, 0px) + 24px)
          calc(env(safe-area-inset-right, 0px) + 24px)
          calc(env(safe-area-inset-bottom, 0px) + 24px)
          calc(env(safe-area-inset-left, 0px) + 24px);
        box-sizing: border-box;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      img {
        width: 80px;
        border-radius: 22px;
      }
      p {
        color: #aebdbb;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        background: #ffd65b;
        color: #15243d;
        padding: 14px 24px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/arena-192.png" alt="Pokémon Arena" />
      <h1>Your arena will be here.</h1>
      <p>
        You are offline. Sign-in and live matches need an internet connection.
        Reconnect, then return to the arena.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
